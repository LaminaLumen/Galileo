[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-publishing"
version = "0.1.0"
description = "中文优先、隐私友好的自托管个人发布起步项目"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LaminaLumen" }]
keywords = ["blog", "flask", "self-hosted", "publishing", "chinese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.0.0; platform_system != 'Windows'",
  "markdown-it-py==4.2.0",
  "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
  "detect-secrets==1.5.0",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
]

[project.urls]
Homepage = "https://github.com/LaminaLumen/Galileo"
Issues = "https://github.com/LaminaLumen/Galileo/issues"
Repository = "https://github.com/LaminaLumen/Galileo"

[tool.setuptools.packages.find]
include = ["galileo*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=galileo --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
