server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.galileo.blog veanrxgqxnsc.ap-southeast-1.clawcloudrun.com;

    # ✅ Cloudflare Origin CA 证书
    ssl_certificate /etc/nginx/ssl/galileoblog.pem;
    ssl_certificate_key /etc/nginx/ssl/galileoblog.key;

    # 🔒 重要设置：允许Cloudflare连接（即使源没有公共信任证书）
    ssl_verify_client off;

    # ⏱️ SSL优化参数（根据需求调整）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:EDH+AESGCM;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ecdh_curve secp384r1;

    # ⚙️ 设置代理头 (Flask需要知道真实客户端信息)
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 📍 可选：HTTP自动跳转HTTPS
    # 🔄 如果ClawCloud允许通过HTTP(80)访问，且希望强制HTTPS:
    server {
        listen 80;
        listen [::]:80;
        server_name www.galileo.blog veanrxgqxnsc.ap-southeast-1.clawcloudrun.com gtenbjsrnerv.ap-southeast-1.clawcloudrun.com;
        return 301 https://$host$request_uri;
    }
}