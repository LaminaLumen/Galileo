# 此文件不会被默认加载。生产环境应优先在已有网关终止 TLS。
# 如需由 Galileo 的 Nginx 直接终止 TLS，请将本配置作为 conf.d/default.conf 挂载，
# 并把证书以只读文件挂载到 /run/secrets/tls.crt 与 /run/secrets/tls.key。

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name example.com;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 只有确认该域名及所有子域将长期使用 HTTPS 后，才能启用 HSTS。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        root /srv;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
