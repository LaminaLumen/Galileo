name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: 安装开发依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 格式检查
        run: ruff format --check .

      - name: 自动测试
        run: pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装扫描工具
        run: python -m pip install detect-secrets==1.5.0

      - name: 扫描当前工作树
        run: python scripts/check_secrets.py

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 校验 Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.release.yml config --quiet

      - name: 构建镜像
        run: docker compose build

      - name: 启动并执行健康检查
        run: |
          docker compose up --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/feed.xml > /dev/null

      - name: 输出容器日志
        if: failure()
        run: docker compose logs --no-color

      - name: 清理容器
        if: always()
        run: docker compose down --volumes
