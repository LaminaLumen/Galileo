# HTTPS服务配置
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name galileo.blog www.galileo.blog veanrxgqxnsc.ap-southeast-1.clawcloudrun.com;

    ssl_certificate /etc/nginx/ssl/galileoblog.pem;
    ssl_certificate_key /etc/nginx/ssl/galileoblog.key;
    ssl_verify_client off;

    # SSL优化参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:EDH+AESGCM;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ecdh_curve secp384r1;

    # 代理设置
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ✅ 独立的HTTP重定向配置（与上面的server块平级）
server {
    listen 80;
    listen [::]:80;
    server_name galileo.blog www.galileo.blog gtenbjsrnerv.ap-southeast-1.clawcloudrun.com veanrxgqxnsc.ap-southeast-1.clawcloudrun.com;
    return 301 https://$host$request_uri;
}