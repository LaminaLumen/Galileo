name: Publish container images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 已发布的语义化版本号，例如 0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: galileo-app
            image: ghcr.io/laminalumen/galileo-app
            dockerfile: Dockerfile
          - package: galileo-web
            image: ghcr.io/laminalumen/galileo-web
            dockerfile: nginx/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 核对标签与项目版本
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_VERSION#v}" = "${PACKAGE_VERSION}"

      - name: 配置 QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.package }}
            org.opencontainers.image.description=Galileo 中文优先、隐私友好的自托管发布服务
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送多架构镜像
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

      - name: 注销 GHCR
        if: github.event_name == 'push'
        run: docker logout ghcr.io

      - name: 匿名核验远端多架构清单
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          IMAGE_REF="${IMAGE}:${RELEASE_VERSION#v}"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "${IMAGE_REF}")"
          printf '%s\n' "${INSPECT_OUTPUT}"
          printf '%s\n' "${INSPECT_OUTPUT}" | grep -q 'Platform:[[:space:]]*linux/amd64'
          printf '%s\n' "${INSPECT_OUTPUT}" | grep -q 'Platform:[[:space:]]*linux/arm64'
